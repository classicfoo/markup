[package]
name = "screenshot-markup"
version = "0.1.1"
edition = "2021"
description = "A desktop screenshot annotation tool built with Rust and egui"
license = "GPL-3.0-only"

[dependencies]
ab_glyph = "0.2"
arboard = { version = "3.4", default-features = false, features = ["image-data"] }
dirs = "6"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
imageproc = "0.25"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
