name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Build Windows app
        run: cargo build --locked --release

      - name: Package app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/screenshot-markup.exe dist/
          Copy-Item README.md, LICENSE, assets/DejaVu-LICENSE.txt dist/
          Compress-Archive -Path dist/* -DestinationPath screenshot-markup-windows-x64.zip

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: screenshot-markup-windows-x64.zip
